<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Agent analysis page</title>
  <desc id="desc">The hosted AI Shop Agent page presents source evidence and a durable product-recognition report. The example is a video result while this presentation focuses on the stored-photo run endpoint.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172D43}
      .title{font-size:46px;font-weight:700}
      .label{font-size:25px;font-weight:700}
      .body{font-size:21px;fill:#52657A}
      .scope{font-size:18px;fill:#6A5422}
    </style>
    <clipPath id="screenCrop"><rect x="72" y="172" width="1045" height="590" rx="8"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#F7F4EB"/>
  <rect x="72" y="62" width="66" height="7" fill="#1E7A55"/>
  <text x="72" y="132" class="title">The Agent analysis page</text>
  <g clip-path="url(#screenCrop)">
    <image href="../assets/agent-analysis-page.png" x="72" y="172" width="1045" height="582" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="72" y="172" width="1045" height="590" rx="8" fill="none" stroke="#C7CDC8" stroke-width="2"/>
  <path d="M1170 188 V744" stroke="#D2D8D3" stroke-width="2"/>
  <circle cx="1217" cy="247" r="8" fill="#1E7A55"/>
  <text x="1243" y="255" class="label">Source evidence</text>
  <text x="1217" y="292" class="body">The page retains the media</text>
  <text x="1217" y="321" class="body">that produced the findings.</text>
  <circle cx="1217" cy="404" r="8" fill="#1E7A55"/>
  <text x="1243" y="412" class="label">Durable record</text>
  <text x="1217" y="449" class="body">Status and results survive</text>
  <text x="1217" y="478" class="body">refreshes and later visits.</text>
  <circle cx="1217" cy="561" r="8" fill="#1E7A55"/>
  <text x="1243" y="569" class="label">Reviewable findings</text>
  <text x="1217" y="606" class="body">Products, visible facings</text>
  <text x="1217" y="635" class="body">and confidence stay linked.</text>
  <rect x="72" y="799" width="1456" height="58" rx="6" fill="#F4E8C8"/>
  <text x="98" y="835" class="scope">Scope note: this capture shows a video result. The deck follows POST /v1/agent/analyses/{id}/run for an already stored JPEG.</text>
</svg>
