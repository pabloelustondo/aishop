<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Shop Agent Photo Analysis</title>
  <desc id="desc">Cover slide introducing the server-side path from a stored photograph through external GPT recognition to a durable report.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:72px;font-weight:700;fill:#F7F4EB}
      .subtitle{font-size:34px;fill:#C8D7D2}
      .endpoint{font-family:Menlo,Consolas,monospace;font-size:25px;fill:#172D43}
      .step{font-size:23px;font-weight:700;fill:#F7F4EB}
      .minor{font-size:20px;fill:#AFC2BD}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#10251F"/>
  <rect x="94" y="105" width="82" height="8" fill="#2AA876"/>
  <text x="94" y="225" class="title">AI Shop Agent</text>
  <text x="94" y="310" class="title">Photo Analysis</text>
  <text x="98" y="380" class="subtitle">From a stored shelf photograph to a durable recognition report</text>
  <rect x="98" y="425" width="775" height="58" rx="8" fill="#F7F4EB"/>
  <text x="123" y="462" class="endpoint">POST /v1/agent/analyses/{id}/run</text>
  <path d="M100 668 H1500" stroke="#527068" stroke-width="2"/>
  <circle cx="160" cy="668" r="12" fill="#2AA876"/>
  <circle cx="570" cy="668" r="12" fill="#2AA876"/>
  <circle cx="990" cy="668" r="12" fill="#D2A43B"/>
  <circle cx="1410" cy="668" r="12" fill="#2AA876"/>
  <text x="120" y="728" class="step">Stored photograph</text>
  <text x="515" y="728" class="step">AI Shop server</text>
  <text x="934" y="728" class="step">External GPT</text>
  <text x="1336" y="728" class="step">Durable report</text>
  <text x="120" y="766" class="minor">Private evidence</text>
  <text x="515" y="766" class="minor">Authorization and orchestration</text>
  <text x="934" y="766" class="minor">Visual recognition over HTTPS</text>
  <text x="1336" y="766" class="minor">Saved for later review</text>
</svg>
