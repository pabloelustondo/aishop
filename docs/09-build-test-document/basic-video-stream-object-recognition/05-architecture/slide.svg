<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">High-level architecture</title>
<desc id="desc">One pipeline, two execution hosts. Read in top-to-bottom order. Speaker notes are in the paired Markdown file.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text font-family="Arial" font-size="50" font-weight="700" fill="#102C43"><tspan x="76" y="92">High-level architecture</tspan></text>
<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">One pipeline, two execution hosts</tspan></text>
<rect x="180" y="196" width="1240" height="92" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="237">Mac package tests / iPhone Debug harness</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="272">Both call CandidateAnalysisPipeline</tspan></text>
<path d="M 797 291 H 803 V 305 H 810 L 800 315 L 790 305 H 797 Z" fill="#17667B"/>
<rect x="180" y="318" width="1240" height="92" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="359">Local inputs</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="394">LocalTargetCatalog + VideoFixtureFrameStream</tspan></text>
<path d="M 797 413 H 803 V 427 H 810 L 800 437 L 790 427 H 797 Z" fill="#17667B"/>
<rect x="180" y="440" width="1240" height="92" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="481">CandidateScorer</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="516">VisionFeatureAdapter compares whole frame and central crop</tspan></text>
<path d="M 797 535 H 803 V 549 H 810 L 800 559 L 790 549 H 797 Z" fill="#17667B"/>
<rect x="180" y="562" width="1240" height="92" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="603">CandidateEpisodeAggregator</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="638">Groups supporting samples and chooses the best evidence</tspan></text>
<path d="M 797 657 H 803 V 671 H 810 L 800 681 L 790 671 H 797 Z" fill="#17667B"/>
<rect x="180" y="684" width="1240" height="92" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="725">Report and evidence</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="760">SessionReportBuilder + JSONL SessionLog + separate local images</tspan></text>
<text font-family="Arial" font-size="26" font-weight="400" fill="#506476"><tspan x="76" y="829">FixtureEvaluator is a separate test/development target. The app does not link annotations.</tspan></text>
