<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">CandidateAnalysisPipeline</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="230">01</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="230">Start a worker away from the UI thread</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="299">02</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="299">Compose stream, scorer, aggregator, and recorder</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="368">03</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="368">Finalize once after stop, cancellation, error, or EOF</tspan></text>
<text font-family="Arial" font-size="23" font-weight="400" fill="#506476"><tspan x="76" y="447">Selected Swift lines</tspan></text>
<rect x="76" y="458" width="1448" height="181" fill="#EEF5F6" stroke="none" stroke-width="0"/>
<text font-family="Courier New" font-size="26" font-weight="400" fill="#102C43"><tspan x="98" y="492">let worker = Task.detached { try await self.execute(onUpdate: onUpdate) }</tspan><tspan x="98" y="522.94">return try await withTaskCancellationHandler { try await worker.value } onCancel: {</tspan><tspan x="98" y="553.88">    self.stream.cancel()</tspan><tspan x="98" y="584.8199999999999">    worker.cancel()</tspan><tspan x="98" y="615.76">}</tspan></text>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="772">CandidateAnalysisPipelineTests + PipelineIntegrationSuite</tspan></text>
<text font-family="Arial" font-size="27" font-weight="400" fill="#506476"><tspan x="76" y="818">Real frames arrive before EOF. Reports rebuild from logs. Cancellation finalizes once.</tspan></text>
