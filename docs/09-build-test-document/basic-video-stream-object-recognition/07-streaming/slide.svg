<title id="title">Incremental frame delivery</title>
<desc id="desc">VideoFixtureFrameStream. Read in top-to-bottom order. Speaker notes are in the paired Markdown file.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text font-family="Arial" font-size="50" font-weight="700" fill="#102C43"><tspan x="76" y="92">Incremental frame delivery</tspan></text>
<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">VideoFixtureFrameStream</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="230">01</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="230">Decode one video sample and keep its presentation timestamp</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="299">02</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="299">Select eligible slots at 2 frames per second</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="368">03</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="368">Replay holds one active consumer and one replaceable pending frame</tspan></text>
<text font-family="Arial" font-size="23" font-weight="400" fill="#506476"><tspan x="76" y="447">Selected Swift lines</tspan></text>
<rect x="76" y="458" width="1448" height="181" fill="#EEF5F6" stroke="none" stroke-width="0"/>
<text font-family="Courier New" font-size="26" font-weight="400" fill="#102C43"><tspan x="98" y="492">let (frames, continuation) = AsyncThrowingStream&lt;VideoFrame, Error&gt;.makeStream(</tspan><tspan x="98" y="522.94">    bufferingPolicy: .bufferingNewest(1))</tspan><tspan x="98" y="553.88">if case .dropped(let old) = continuation.yield(frame) {</tspan><tspan x="98" y="584.8199999999999">    try self.drop(old, observer: observer)</tspan><tspan x="98" y="615.76">}</tspan></text>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="772">VideoFixtureFrameStreamTests</tspan></text>
<text font-family="Arial" font-size="27" font-weight="400" fill="#506476"><tspan x="76" y="818">Both videos repeat with stable frame IDs. Slow replay drops stale work and stops cleanly.</tspan></text>
