<title id="title">Candidate scoring</title>
<desc id="desc">CandidateScorer and the frozen ScoringProfile. Read in top-to-bottom order. Speaker notes are in the paired Markdown file.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text font-family="Arial" font-size="50" font-weight="700" fill="#102C43"><tspan x="76" y="92">Candidate scoring</tspan></text>
<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">CandidateScorer and the frozen ScoringProfile</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="230">01</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="230">Compare the whole frame and a centered 60% × 60% crop</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="299">02</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="299">Use the smaller distance as the frame's evidence</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="368">03</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="368">Support the target when distance ≤ 0.4293864220380783</tspan></text>
<text font-family="Arial" font-size="23" font-weight="400" fill="#506476"><tspan x="76" y="447">Selected Swift lines</tspan></text>
<rect x="76" y="458" width="1448" height="181" fill="#EEF5F6" stroke="none" stroke-width="0"/>
<text font-family="Courier New" font-size="26" font-weight="400" fill="#102C43"><tspan x="98" y="492">public var distance: Double { min(wholeDistance, cropDistance) }</tspan><tspan x="98" y="522.94">public var similarity: Double { 1 / (1 + distance) }</tspan><tspan x="98" y="553.88">public func supports(maximumDistance: Double) -&gt; Bool {</tspan><tspan x="98" y="584.8199999999999">    distance &lt;= maximumDistance</tspan><tspan x="98" y="615.76">}</tspan></text>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="772">CandidateScorerTests + fixed-profile integration tests</tspan></text>
<text font-family="Arial" font-size="27" font-weight="400" fill="#506476"><tspan x="76" y="818">82 sampled frames support the calibration. Tests and phone runs never choose a new threshold.</tspan></text>
