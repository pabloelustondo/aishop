<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">Session termination</title>
<desc id="desc">One run, one finalization path. Read in top-to-bottom order. Speaker notes are in the paired Markdown file.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text font-family="Arial" font-size="50" font-weight="700" fill="#102C43"><tspan x="76" y="92">Session termination</tspan></text>
<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">One run, one finalization path</tspan></text>
<rect x="180" y="212" width="1240" height="106" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="253">Running session</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="288">Frames update an optional active episode</tspan></text>
<path d="M 797 321 H 803 V 335 H 810 L 800 345 L 790 335 H 797 Z" fill="#17667B"/>
<rect x="180" y="360" width="1240" height="106" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="401">End, user stop, or task cancellation</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="436">Stop input and identify the stream-end reason</tspan></text>
<path d="M 797 469 H 803 V 483 H 810 L 800 493 L 790 483 H 797 Z" fill="#17667B"/>
<rect x="180" y="508" width="1240" height="106" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="549">Close the active episode</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="584">Retain its last evidence and explicit close reason</tspan></text>
<path d="M 797 617 H 803 V 631 H 810 L 800 641 L 790 631 H 797 Z" fill="#17667B"/>
<rect x="180" y="656" width="1240" height="106" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="697">Finalize</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="732">Write stream-end event, summary, and close the log</tspan></text>
<text font-family="Arial" font-size="26" font-weight="400" fill="#506476"><tspan x="76" y="829">One-shot execution and lifecycle tests guard against duplicate summaries.</tspan></text>
