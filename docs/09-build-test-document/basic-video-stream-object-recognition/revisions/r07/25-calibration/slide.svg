<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">Mac and iPhone comparison</title>
<desc id="desc">Match evidence first, then compare decisions. Read in top-to-bottom order. Speaker notes are in the paired Markdown file.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text font-family="Arial" font-size="50" font-weight="700" fill="#102C43"><tspan x="76" y="92">Mac and iPhone comparison</tspan></text>
<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">Match evidence first, then compare decisions</tspan></text>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="231">Prerequisites</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="277">Same inputs, reference, profile, frame IDs, and timestamps</tspan></text>
<rect x="76" y="333" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="377">Completeness</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="423">Both fixtures, normal exhaustion, zero drops, contiguous slots</tspan></text>
<rect x="76" y="479" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="523">Agreement</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="569">Every sampled frame is on the same side of the threshold</tspan></text>
<rect x="76" y="625" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="669">Outcomes</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="715">0 = agreement; 2 = changed decisions; 1 = failed or invalid evidence</tspan></text>
