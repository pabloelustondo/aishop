<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">Frozen rules and their reasons</title>
<desc id="desc">A repeatable experiment needs stable decisions. Read in top-to-bottom order. Speaker notes are in the paired Markdown file.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text font-family="Arial" font-size="50" font-weight="700" fill="#102C43"><tspan x="76" y="92">Frozen rules and their reasons</tspan></text>
<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">A repeatable experiment needs stable decisions</tspan></text>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="231">Sampling and preprocessing</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="277">2 samples/s, Vision revision 2, scaleFill, central crop 0.6</tspan></text>
<rect x="76" y="333" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="377">Support threshold</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="423">Distance ≤ 0.4293864220380783</tspan></text>
<rect x="76" y="479" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="523">Episode rules</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="569">2 consecutive supporting slots; close after a 1.5 s gap</tspan></text>
<rect x="76" y="625" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="669">Reason and limitation</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="715">Fixed Mac-fixture experiment, not a universal product model</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476"><tspan x="76" y="828">Neither tests nor phone runs retune the threshold.</tspan></text>
<text font-family="Arial" font-size="23" font-weight="400" fill="#506476"><tspan x="76" y="878">Code:</tspan></text>
