<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AIShop Sprint 001 walkthrough</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">AIShopVision · Sprint 001 · revision 04</p>
        <h1>Streaming video candidate recognition</h1>
      </div>
      <a class="deck-link" href="../artifacts/Sprint-001-Walkthrough-r04.pptx">Download the full deck</a>
    </header>
    <main>
      <section class="slide-stage" aria-label="Presentation slide"><img id="slide-image" alt="Current presentation slide"></section>
      <aside class="narration" aria-live="polite">
        <p id="chapter-label" class="eyebrow"></p><p id="slide-count"></p><h2 id="slide-title"></h2><p id="slide-subtitle"></p>
        <details open><summary>Speaker notes</summary><div id="speaker-notes"></div></details>
        <section><h3>Code and evidence</h3><nav id="slide-links" aria-label="Code and evidence links"></nav></section>
      </aside>
    </main>
    <footer>
      <div class="transport" aria-label="Player controls"><button id="previous" type="button">Previous</button><button id="play" type="button">Read this slide</button><button id="pause" type="button" disabled>Pause</button><button id="next" type="button">Next</button></div>
      <label class="speed">Reading speed <input id="speed" type="range" min="0.7" max="1.3" step="0.1" value="1"> <output id="speed-value">1.0×</output></label>
      <label class="voice">Voice <select id="voice"><option>System voice</option></select></label>
      <label class="autoplay"><input id="autoplay" type="checkbox" checked> Continue to the next slide</label>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
