<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">The session-log contract</title>
<desc id="desc">One JSON object per line, one ordered session. Read in top-to-bottom order. Speaker notes are in the paired Markdown file.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text font-family="Arial" font-size="50" font-weight="700" fill="#102C43"><tspan x="76" y="92">The session-log contract</tspan></text>
<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">One JSON object per line, one ordered session</tspan></text>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="231">Envelope</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="277">Sequence, session ID, event kind, frame ID, media timestamp</tspan></text>
<rect x="76" y="333" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="377">Header</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="423">Schema version, host, build, fixture/reference hashes, profile</tspan></text>
<rect x="76" y="479" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="523">Body</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="569">Sampling, scores, episode changes, termination, and errors</tspan></text>
<rect x="76" y="625" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="669">End</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="715">Exactly one summary and one stream-end event</tspan></text>
<text font-family="Arial" font-size="23" font-weight="400" fill="#506476"><tspan x="76" y="878">Code:</tspan></text>
