<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">Per-frame scoring</title>
<desc id="desc">Two distances describe one sampled frame. Read in top-to-bottom order. Speaker notes are in the paired Markdown file.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text font-family="Arial" font-size="50" font-weight="700" fill="#102C43"><tspan x="76" y="92">Per-frame scoring</tspan></text>
<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">Two distances describe one sampled frame</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="230">01</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="230">Measure the whole image and a central 60% crop</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="299">02</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="299">Keep both distances and select the smaller one</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="368">03</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="368">Carry frame identity, sample slot, media time, and latency</tspan></text>
<text font-family="Arial" font-size="23" font-weight="400" fill="#506476"><tspan x="76" y="447">Selected Swift lines</tspan></text>
<rect x="76" y="458" width="1448" height="181" fill="#EEF5F6" stroke="none" stroke-width="0"/>
<text font-family="Courier New" font-size="26" font-weight="400" fill="#102C43"><tspan x="98" y="492">public var distance: Double { min(wholeDistance, cropDistance) }</tspan><tspan x="98" y="522.94">public var similarity: Double { 1 / (1 + distance) }</tspan><tspan x="98" y="553.88">public func supports(maximumDistance: Double) -&gt; Bool {</tspan><tspan x="98" y="584.8199999999999">    distance &lt;= maximumDistance</tspan><tspan x="98" y="615.76">}</tspan></text>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="772">Scorer tests verify variant choice and fixed behavior</tspan></text>
<text font-family="Arial" font-size="27" font-weight="400" fill="#506476"><tspan x="76" y="818">Lower distance is closer. Similarity is not a probability.</tspan></text>
<text font-family="Arial" font-size="23" font-weight="400" fill="#506476"><tspan x="76" y="878">Code:</tspan></text>
