<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">Incremental video decoding</title>
<desc id="desc">VideoFixtureFrameStream owns input delivery. Read in top-to-bottom order. Speaker notes are in the paired Markdown file.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text font-family="Arial" font-size="50" font-weight="700" fill="#102C43"><tspan x="76" y="92">Incremental video decoding</tspan></text>
<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">VideoFixtureFrameStream owns input delivery</tspan></text>
<rect x="180" y="212" width="1240" height="106" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="253">Open the local video track</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="288">AVAssetReader decodes incrementally</tspan></text>
<path d="M 797 321 H 803 V 335 H 810 L 800 345 L 790 335 H 797 Z" fill="#17667B"/>
<rect x="180" y="360" width="1240" height="106" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="401">Read its presentation timestamp</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="436">Keep media identity and received-frame accounting</tspan></text>
<path d="M 797 469 H 803 V 483 H 810 L 800 493 L 790 483 H 797 Z" fill="#17667B"/>
<rect x="180" y="508" width="1240" height="106" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
<text font-family="Arial" font-size="32" font-weight="700" fill="#102C43" text-anchor="middle"><tspan x="800" y="549">Select an eligible sample slot</tspan></text>
<text font-family="Arial" font-size="25" font-weight="400" fill="#506476" text-anchor="middle"><tspan x="800" y="584">Default cadence: 2 frames per second</tspan></text>
<path d="M 797 617 H 803 V 631 H 810 L 800 641 L 790 631 H 797 Z" fill="#17667B"/>
<rect x="180" y="656" width="1240" height="106" fill="#EEF5F6" stroke="#D0DBE1" stroke-width="1"/>
