<title id="title">Report construction and replay</title>
<desc id="desc">The same event reducer serves live and offline views. Read in top-to-bottom order. Speaker notes are in the paired Markdown file.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text font-family="Arial" font-size="50" font-weight="700" fill="#102C43"><tspan x="76" y="92">Report construction and replay</tspan></text>
<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">The same event reducer serves live and offline views</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="230">01</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="230">Count frames and accumulate latency from events</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="299">02</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="299">Update episodes by stable episode ID</tspan></text>
<text font-family="Arial" font-size="30" font-weight="700" fill="#17667B"><tspan x="76" y="368">03</tspan></text>
<text font-family="Arial" font-size="32" font-weight="400" fill="#102C43"><tspan x="160" y="368">Rebuild and compare with the recorded final summary</tspan></text>
<text font-family="Arial" font-size="23" font-weight="400" fill="#506476"><tspan x="76" y="447">Selected Swift lines</tspan></text>
<rect x="76" y="458" width="1448" height="119" fill="#EEF5F6" stroke="none" stroke-width="0"/>
<text font-family="Courier New" font-size="26" font-weight="400" fill="#102C43"><tspan x="98" y="492">let events = try SessionLog.read(url: logURL)</tspan><tspan x="98" y="522.94">for event in events { try builder.consume(event) }</tspan><tspan x="98" y="553.88">let recorded = try summary.payload(as: SessionReport.self)</tspan></text>
