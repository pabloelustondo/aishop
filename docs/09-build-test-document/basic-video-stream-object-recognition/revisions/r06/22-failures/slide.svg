<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">Failure behavior</title>
<desc id="desc">Errors must remain distinguishable from negative results. Read in top-to-bottom order. Speaker notes are in the paired Markdown file.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text font-family="Arial" font-size="50" font-weight="700" fill="#102C43"><tspan x="76" y="92">Failure behavior</tspan></text>
<text font-family="Arial" font-size="28" font-weight="400" fill="#506476"><tspan x="78" y="146">Errors must remain distinguishable from negative results</tspan></text>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="231">Invalid input or inference</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="277">Throw the underlying error; no invented score</tspan></text>
<rect x="76" y="333" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="377">Failure after log creation</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="423">Record error and close an open episode when writing is possible</tspan></text>
<rect x="76" y="479" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="523">Storage or early setup failure</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="569">A complete summary may be impossible; surface the failure</tspan></text>
<rect x="76" y="625" width="1448" height="1" fill="#D0DBE1" stroke="none" stroke-width="0"/>
<text font-family="Arial" font-size="29" font-weight="700" fill="#17667B"><tspan x="76" y="669">Evidence reader</tspan></text>
<text font-family="Arial" font-size="33" font-weight="400" fill="#102C43"><tspan x="76" y="715">Reject failed, truncated, or inconsistent sessions</tspan></text>
<text font-family="Arial" font-size="23" font-weight="400" fill="#506476"><tspan x="76" y="878">Code:</tspan></text>
